# Keeps the free live server from sleeping, so a judge never waits for a cold start. A backup to
# an UptimeRobot monitor. OFF until the founder switches it on: uncomment the schedule, and only
# once the staging service is suspended (the free plan's hours are shared between services).
name: Keep the demo awake

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://northvaine.onrender.com/health
