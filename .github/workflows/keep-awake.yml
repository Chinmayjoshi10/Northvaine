# Keeps the free live server from sleeping, so a judge never waits for a cold start. A backup to
# an UptimeRobot monitor. ON since 18 Nov (founder); the staging service is suspended, so the
# live server alone uses the free plan's hours.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://northvaine.onrender.com/health
