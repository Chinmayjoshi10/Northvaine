# One real "Build my radar" on the live demo each morning, the way a judge would do it. If the radar
# does not finish or does not open, the run fails and GitHub notifies the repo owner.
# OFF until the founder switches it on (judging, Dec 2026): uncomment the schedule.
name: Daily live check

on:
  # schedule:
  #   - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --no-project --with httpx python scripts/synthetic_check.py
