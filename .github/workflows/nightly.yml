name: Nightly demo

# Runs the radar live for the public demo client, exports the pages as static JSON, builds the
# frontend in static mode and deploys it to Pages. If any step fails, nothing deploys and
# yesterday's site stays live. See docs/HOSTING.md.
on:
  # Paused until the free web-search month resets (founder, 24 Oct): run by hand only.
  # schedule:
  #   - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly-demo
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_BASE_URL: ${{ secrets.NEBIUS_BASE_URL }}
      MODEL_FAST: ${{ secrets.MODEL_FAST }}
      MODEL_MID: ${{ secrets.MODEL_MID }}
      MODEL_DEEP: ${{ secrets.MODEL_DEEP }}
      MODEL_EMBED: ${{ secrets.MODEL_EMBED }}
      EMBED_DIM: ${{ secrets.EMBED_DIM }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      DAILY_BUDGET_USD: ${{ secrets.DAILY_BUDGET_USD }}
      TOTAL_BUDGET_USD: ${{ secrets.TOTAL_BUDGET_USD }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (Python 3.12 and locked dependencies)
        run: uv sync --frozen

      # The recordings go to /tmp and are discarded; the report is what the site carries.
      - name: Run the radar live for the demo client
        run: >
          uv run python scripts/radar.py --client stone_exporter_demo --record --yes
          --clients-dir deploy/demo/clients --fixtures-dir /tmp/fixtures --out demo_reports/radar

      - name: Check the report was written
        run: test -n "$(find demo_reports/radar -name run.json | head -n 1)"

      # The client is anonymised: drop its own group and customers (private list in a secret),
      # remove company contacts, and stop if anything identifying is left (nothing deploys).
      - name: Make the report safe to publish
        env:
          DEMO_FORBID: ${{ secrets.DEMO_FORBID }}
        run: uv run python scripts/sanitize_demo_report.py demo_reports/radar

      - name: Export the demo pages as static JSON
        run: >
          uv run python scripts/export_static.py --reports demo_reports/radar --out site_data
          --clients-dir deploy/demo/clients

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend in static mode
        env:
          VITE_STATIC_DATA: "1"
          VITE_LIVE_API: https://northvaine.onrender.com
          VITE_BASE: /Northvaine/
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          cp -r site_data frontend/dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
