[project]
name = "northvaine"
version = "0.1.0"
description = "AI sales assistant for B2B businesses — Radar finds buyers, Gateway makes you findable"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

# Substrate only (factory/board/M1/PLAN.md, Decisions 3). Later-milestone deps come back with
# the milestone that uses them. python-dotenv arrives through pydantic-settings.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.1.2,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<2",
    "pgvector>=0.5,<0.6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.8",
    "httpx>=0.28,<1",  # test client only
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["northvaine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: tests that hit real APIs (skipped by default)",
    "golden: known-answer golden set tests",
    "db: tests that need a real Postgres (skip unless TEST_DATABASE_URL is set)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Factory tooling outside M1 ticket scopes; remove once the file is cleaned up.
"scripts/factory_status.py" = ["E501", "I001", "UP017"]
